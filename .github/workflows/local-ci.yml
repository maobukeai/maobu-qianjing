name: Maobu local build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test --timeout 10000
      - name: Verify the dashboard in Chrome
        run: bun run ui:qa --rows 2000
      - name: Upload dashboard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maobu-dashboard-qa
          path: |
            reports/ui-qa/*/ui-upgrade/*.png
            reports/ui-qa/*/ui-upgrade/result.json
          if-no-files-found: ignore
      - run: bun run docs:public:check
      - run: bun run i18n:locales:check
      - run: bun run desktop:prepare
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - run: bun run desktop:verify
      - uses: actions/upload-artifact@v4
        with:
          name: maobu-local-windows
          path: |
            src-tauri/target/debug/aliasmode.exe
            src-tauri/target/debug/aliasmode-sidecar.exe
            src-tauri/target/debug/aliasmode-mcp.exe
            src-tauri/target/debug/playwright/
            LICENSE
            NOTICE
