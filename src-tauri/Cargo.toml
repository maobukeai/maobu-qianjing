[package]
name = "aliasmode-desktop"
version = "3.0.0"
description = "Maobu local browser profile manager"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
default-run = "aliasmode"

[lib]
name = "aliasmode_desktop"
crate-type = ["rlib"]

[[bin]]
name = "aliasmode"
path = "src/main.rs"

# Keeps the installed MCP helper path; the helper code runs inside the sidecar program.
[[bin]]
name = "aliasmode-mcp"
path = "src/bin/aliasmode-mcp.rs"

[[bin]]
name = "maobu-release-verify"
path = "../scripts/release-verify.rs"
required-features = ["release-tools"]

[features]
release-tools = ["dep:minisign-verify"]

[build-dependencies]
serde_json = "1.0.145"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
minisign-verify = { version = "=0.2.5", optional = true }
percent-encoding = "2.3"
hex = "0.4.3"
rand = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = ["gzip", "json", "native-tls-no-alpn"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tokio = { version = "1.48.0", features = ["sync", "time", "macros"] }
url = "2.5.7"
zeroize = "1.8.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
